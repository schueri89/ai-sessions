name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag passt zur Version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu package.json ($version)."
            exit 1
          fi

      - run: npm ci

      # npm run check stays local: some checks need the projects under c:\lucee\tomcat\webapps\ROOT.
      - run: npm run package

      - name: Release-Notes aus CHANGELOG.md
        run: |
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const md = fs.readFileSync("CHANGELOG.md", "utf8");
            const start = md.indexOf("## [" + version + "]");
            if (start < 0) throw new Error("Kein CHANGELOG-Eintrag für " + version);
            const next = md.indexOf("\n## [", start + 1);
            const body = md.slice(md.indexOf("\n", start) + 1, next < 0 ? undefined : next).trim();
            fs.writeFileSync("release-notes.md", body + "\n");
          ' "${GITHUB_REF_NAME#v}"

      - name: GitHub Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "vsix/ai-sessions-${GITHUB_REF_NAME#v}.vsix" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
